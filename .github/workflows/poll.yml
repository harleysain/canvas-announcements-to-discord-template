name: Poll Canvas announcements

on:
  schedule:
    # Mon / Wed / Fri only (day-of-week 1,3,5), every 30 minutes from 13:00 to
    # 21:59 UTC. That is 07:07-15:37 US Central in winter, 08:07-16:37 in
    # summer, so the window covers the Canvas posting time under either.
    #
    # Why so many slots: GitHub's scheduled runs are best-effort and are
    # currently being dropped and delayed by hours. The script posts each
    # announcement at most once per local calendar date, so extra runs cannot
    # produce duplicates - they only raise the odds that at least one lands.
    #
    # The script also re-checks the weekday itself in its own timezone, so a
    # cron slot on an unintended day is a no-op rather than a stray post.
    - cron: "7,37 13-21 * * 1,3,5"
  workflow_dispatch: # lets you run it manually from the Actions tab

# Needed so the job can commit the updated state file back to the repo.
permissions:
  contents: write

# Never let two runs overlap and fight over state/seen.json.
concurrency:
  group: poll-canvas
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Without this, a hung job holds the concurrency group for GitHub's
    # 6-hour default and every later scheduled run queues behind it.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Caching one tiny dependency isn't worth it, and this job has
          # contents:write, so leaving automatic caching off is the safer default.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check for new announcements
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CANVAS_FEEDS: ${{ secrets.CANVAS_FEEDS }}
        run: node index.js

      - name: Save which announcements have been posted
        run: |
          if [[ -z "$(git status --porcelain state/seen.json)" ]]; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Update posted-announcement state"
          git push
